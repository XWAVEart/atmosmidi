[project]
name = "atmosmidi"
version = "0.1.0"
description = "Weather → MIDI Generative Engine for Ableton Live"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "mido>=1.3.3",
    "python-rtmidi>=1.5.8",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "websockets>=13.0",
]

[project.scripts]
atmosmidi = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["models", "services", "api"]
